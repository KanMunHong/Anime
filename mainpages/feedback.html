<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

body {
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh;
            /* ANIME BACKGROUND IMAGE */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.65)),
                url('https://wallpapercave.com/wp/wp11332802.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f5f0eb;
            overflow-x: hidden;
        }


    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #fff;
    }

    h2 {
      color: rgb(255, 89, 0);
    }

    .card {
      background-color: rgb(228, 80, 0);
      color: white;
      border-radius: 10px;
      box-shadow: 0 4px 50px rgba(195, 68, 22, 0.895);
    }

    /* Navbar */
    nav {
      background: #222;
      padding: 12px;
      text-align: center;
    }

    nav a {
      color: rgb(229, 102, 6);
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }

    nav a:hover {
      color: #ffd700;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <a href="homepage.html">Home</a>
    <a href="aboutus.html">About Us</a>
    <a href="animenews.html">Anime News</a>
    <a href="popularanime.html">Popular Anime</a>
    <a href="cosplay.html">Cosplay Gallery</a>
    <a href="animecharacter.html">Anime Character</a>
    <a href="feedback.html">Feedback</a>
    <a href="contactus.html">Contact Us</a>
  </nav>

  <div class="container mt-5">

    <h2 class="text-center mb-3">Feedback Form</h2>

    <p class="text-center" style="color: rgb(255, 89, 0);">
      We value your feedback! Share your thoughts with us.
    </p>

    <div class="card p-4 mt-4">

      <form id="feedbackForm">

        <div class="mb-3">
          <label>Name</label>
          <input type="text" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="mb-3">
          <label>Favorite Anime</label>
          <select class="form-control" id="animeSelect" required>
            <option value="">-- Select Anime --</option>
            <option>Naruto</option>
            <option>One Piece</option>
            <option>Jujutsu Kaisen</option>
            <option>Demon Slayer</option>
            <option>Fairy Tail</option>
            <option>Attack on Titan</option>
            <option>Slam Dunk</option>
            <option>Haikyu!!</option>
            <option>Gintama</option>
            <option>Dragon Ball</option>
            <option>Detective Conan</option>
            <option>Doraemon</option>
            <option>Spirited Away</option>
            <option>Anohana</option>
            <option>Frieren: Beyond Journey's End</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="mb-3" id="otherAnimeDiv" style="display: none;">
          <label>Enter your favorite anime</label>
          <input type="text" class="form-control" id="otherAnimeInput" placeholder="Type here...">
        </div>

        <div class="mb-3">
          <label>Comment</label>
          <textarea class="form-control" placeholder="Write your comment" required></textarea>
        </div>

        <div class="mb-3">
          <label>Rating</label>
          <select class="form-control">
            <option>⭐</option>
            <option>⭐⭐</option>
            <option>⭐⭐⭐</option>
            <option>⭐⭐⭐⭐</option>
            <option>⭐⭐⭐⭐⭐</option>
          </select>
        </div>

        <button class="btn btn-dark w-100">Submit</button>

      </form>

    </div>
  </div>

  <footer class="text-center p-3 mt-5" style="background:#111; color:white;">
    <p> ©2026 AnimeClub | Created for UCCD2323 Assignment</p>
  </footer>

  <script>
    document.getElementById("feedbackForm").addEventListener("submit", function (e) {
      e.preventDefault();

      let name = document.querySelector("input").value;
      localStorage.setItem("username", name);

      alert("✅ Thank you for your feedback!");
    });

    let animeSelect = document.getElementById("animeSelect");
    let otherDiv = document.getElementById("otherAnimeDiv");

    animeSelect.addEventListener("change", function () {
      if (this.value === "other") {
        otherDiv.style.display = "block";
      } else {
        otherDiv.style.display = "none";
      }
    });
  </script>

</body>

</html>

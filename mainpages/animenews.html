<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AnimeNews | Latest Anime Updates</title>
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700;14..32,800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.65)),
                url('https://wallpapercave.com/wp/wp2200986.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #f5f0eb;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #2a241e;
        }

        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 10px;
        }

        /* Navigation Bar */
        nav {
            background: #222;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: rgb(229, 102, 6);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        nav a:hover {
            color: #ffd700;
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f97316, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .logo span {
            font-size: 0.9rem;
            color: #ffb683;
            font-weight: 500;
        }

        /**/

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
        }

        /* Page Header */
        .page-header {
            text-align: center;
            padding: 2rem;
            margin: 1rem 0 2rem;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            border: 1px solid rgba(249, 115, 22, 0.5);
        }

        .page-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(120deg, #ffb347, #f97316);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .page-header p {
            font-size: 1.1rem;
            margin-top: 0.5rem;
            color: #f5ede4;
        }

        /* News Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin: 2rem 0;
        }

        /* News Card */
        .news-card {
            background: rgba(20, 15, 28, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(249, 115, 22, 0.35);
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-8px);
            border-color: #f97316;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
        }

        .news-img {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .news-category {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #f97316;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .news-content {
            padding: 1.5rem;
        }

        .news-date {
            font-size: 0.8rem;
            color: #ffb683;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .news-content h3 {
            font-size: 1.3rem;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .news-content p {
            font-size: 0.9rem;
            opacity: 0.85;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .read-more {
            color: #f97316;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: gap 0.3s;
        }

        .news-card:hover .read-more {
            gap: 10px;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: rgba(20, 15, 28, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #f97316;
            position: relative;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(249, 115, 22, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.5rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .close-modal:hover {
            transform: scale(1.1);
            color: #f97316;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .modal-body img {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 1rem;
        }

        .modal-body p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .modal-body .detail-date {
            color: #ffb683;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        footer {
            background: rgba(0, 0, 0, 0.8);
            text-align: center;
            padding: 1.5rem;
            margin-top: 2rem;
            backdrop-filter: blur(8px);
            border-top: 1px solid rgba(249, 115, 22, 0.3);
        }

        @media (max-width: 780px) {
            .navbar {
                flex-direction: column;
                gap: 0.8rem;
                padding: 1rem;
            }

            .nav-links {
                justify-content: center;
                gap: 0.4rem;
            }

            .nav-links li a {
                padding: 0.4rem 0.9rem;
                font-size: 0.8rem;
            }

            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav class="navbar">
            <ul class="nav-links">
                <a href="homepage.html">Home</a>
                <a href="aboutus.html">About Us</a>
                <a href="animenews.html">Anime News</a>
                <a href="popularanime.html">Popular Anime</a>
                <a href="cosplay.html">Cosplay Gallery</a>
                <a href="animecharacter.html">Anime Character</a>
                <a href="feedback.html">Feedback</a>
                <a href="contactus.html">Contact Us</a>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>Anime News</h1>
                <p>Stay updated with the latest happenings in the anime world — new seasons, movie releases, and
                    exclusive announcements!</p>
            </div>

            <div class="news-grid" id="newsGrid">
            </div>
        </div>
    </main>

    <!-- Modal Popup for News Details -->
    <div id="newsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <footer>

        <p style="font-size:0.8rem; margin-top:6px;"> ©2026 AnimeVerse | Created for UCCD2323 Assignment</p>
    </footer>

    <script>
        // News Data Array
        const newsData = [
            {
                id: 1,
                title: "Rooster Fighter",
                category: "TV Series",
                date: "March 16, 2026",
                summary: "Rooster Fighter (Japanese: ニワトリ・ファイター, Hepburn: Niwatori Faitā) is a Japanese web manga series written and illustrated by Shū Sakuratani. An anime television series adaptation, produced by Sanzigen and Viz Media Hero's, premiered internationally in March 2026 and is set to premiere back in Japan in April of the same year.",
                image: "https://th.bing.com/th/id/R.cdc363a9f7efe4a03d5d990d5a7d6835?rik=s4CAEEcF3V1Trg&riu=http%3a%2f%2fwww.bostonbastardbrigade.com%2fwordpress%2fwp-content%2fuploads%2f2023%2f08%2fRooster-Fighter-4-Cover.jpg&ehk=PATEu%2fVrzcJTb2gzx0hOr138dUDG63IO3kEj65Xg4UE%3d&risl=&pid=ImgRaw&r=0",
                fullContent: "Three years ago, mutant demons began appearing in Japan. While some are harmless or helpful towards humans, others are troublesome. Created from humans suffering from extreme emotional distress or unresolved trauma, these mutant demons began to wreak havoc as they began to evolve to be more intelligent and dangerous.A lone rooster named Keiji wanders around various cities of Japan while defeating mutant demons he encounters. His ultimate goal is to find and kill the mutant dubbed 'The White Demon' who killed his sister, Sara, in order to avenge her death."


            },
            {
                id: 2,
                title: "Jujutsu Kaisen Season 3 Released Now!",
                category: "TV Series",
                date: "January 9, 2026",
                summary: "Jujutsu Kaisen Season 3 follows the aftermath of the Shibuya Incident, focusing on the Culling Game, new power struggles, and the mission to rescue Satoru Gojo.",
                image: "https://a.storyblok.com/f/178900/1003x1504/9047535fee/jujutsu-kaisen-season-3-teaser-visual-en.jpg/m/filters:quality(95)format(webp)",
                fullContent: "Following the conclusion of the second season, an unspecified anime sequel covering the (Culling Game) story arc from the manga was announced.[2][3] In August 2025, it was revealed that the sequel would be the series' third season, titled The Culling Game: Part 1 (死滅回游 前編, Shimetsu Kaiyū: Zenpen), which premiered with a one-hour special featuring the first two episodes of the season on January 9, 2026. Shōta Goshozono [ja] returned from the previous season to direct, with Hiroshi Seko and Yoshimasa Terui [ja] respectively returning as series composition writer and music composer.[4][5][6][a] The third season concluded with an extended 27-minute episode on March 27, 2026.[7][b] Immediately following its broadcast, a fourth season, titled The Culling Game: Part 2 (死滅回游 後編, Shimetsu Kaiyū: Kōhen), was announced.[9]"
            },
            {
                id: 3,
                title: "Demon Slayer: Kimetsu no Yaiba Infinity Castle (2025)",
                category: "Movie",
                date: "Sep 12, 2025",
                summary: "The Infinity Castle Arc is the climactic first half of the Final Battle Arc, where the Demon Slayer Corps confronts Muzan and the Upper Rank demons in a deadly, shifting fortress.",
                image: "https://tse1.mm.bing.net/th/id/OIP.3ssRPHKNL1U0joHm9goCxgHaEK?rs=1&pid=ImgDetMain&o=7&rm=3",
                fullContent: "The Infinity Castle Arc (無限城編, Mugen-jō Hen) is the first half of the overarching Final Battle Arc and the eleventh story arc of Demon Slayer. This arc takes place primarily within the Infinity Castle, a surreal and shifting fortress controlled by Nakime, an Upper Rank demon. The arc spans chapters 140 to 183 of the manga and is known for its emotional depth and high-stakes battles.",
            },
            {
                id: 4,
                title: "Steel Ball Run: JoJo's Bizarre Adventure",
                category: "TV Series",
                date: "March 19, 2026",
                summary: "(Japanese: スティール・ボール・ラン ジョジョの奇妙な冒険, Hepburn: Sutīru Bōru Ran: JoJo no Kimyō na Bōken) is the sixth season of the JoJo's Bizarre Adventure anime television series ",
                image: "https://upload.wikimedia.org/wikipedia/en/2/2d/JoJo_Part_7_Steel_Ball_Run.png",
                fullContent: " adapting Steel Ball Run, the seventh part of Hirohiko Araki's JoJo's Bizarre Adventure manga series. Like the previous season, Steel Ball Run was released worldwide as an original net animation season on Netflix, with the first episode having premiered on March 19, 2026. Plot:    In September 1890,[a] riders from across the globe gather in the United States for the Steel Ball Run, a transcontinental horse race from San Diego to New York City offering a 50 million USD prize. Among them is paraplegic former jockey Johnny Joestar, who joins to study the mysterious Spin technique of Neapolitan Gyro Zeppeli after Gyro briefly restores his mobility. Though starting as rivals, Johnny and Gyro become close allies while surviving attacks from ruthless competitors."
            },
            {
                id: 5,
                title: "One Punch Man Season 3",
                category: "TV Series",
                date: "Oct 12, 2025",
                summary: "The third season of the One-Punch Man anime television series is based on the webcomic of the same name written by One and its subsequent manga remake illustrated by Yusuke Murata.",
                image: "https://mlpnk72yciwc.i.optimole.com/cqhiHLc.IIZS~2ef73/w:auto/h:auto/q:75/https://bleedingcool.com/wp-content/uploads/2025/03/one-punch-man-s3-kv3.jpg",
                fullContent: "One Punch Man Season 3 will adapt the highly anticipated Monster Association arc, focusing on intense battles, character development, and the evolving conflict between heroes and monsters.Continuation of the Story: Season 3 picks up from the cliffhanger of Season 2, where Garou, after battling numerous heroes, hints at aligning with the Monster Association. This season will delve deeper into the Monster Association arc, which is known for its action-packed narrative and complex character dynamics. The story will explore Garou's transformation from an anti-hero to a more villainous role, as he seeks to become the greatest monster. "
            },
            {
                id: 6,
                title: "Frieren:Beyond Journey's End Season 2",
                category: "TV Series",
                date: "January 16, 2026",
                summary: "Season 2 of Frieren follows the immortal elf Frieren as she journeys north with Fern and Stark, exploring memories, human connections, and the quiet moments between adventures.",
                image: "https://a.storyblok.com/f/178900/1528x2160/9c32d48ef2/frieren-beyond-journeys-end-season-2-key-visual.jpg/m/filters:quality(95)format(webp)",
                fullContent: "Perhaps one of the best things about Frieren: Beyond Journey's End is how comfortable it is with low stakes even in a fantasy world full of potential excitement and turmoil. The Season 2 premiere luxuriates in daily rituals and understated reaffirmations of the bonds between its core trio: Frieren, a long-lived elven mage, her stern prodigal apprentice Fern, and the warrior Stark.The show is set long after Frieren and her previous party of adventurers helped end the reign of a tyrannical demon king together, and became storied heroes with statues and tales told about them. The series began with the passing of her closest companion Himmel from old age. By comparison, Frieren, who is already hundreds of years old, still looks like a young woman, and will for centuries to come."

            },
        ]
        // Function to render news cards
        function renderNews() {
            const newsGrid = document.getElementById('newsGrid');
            newsGrid.innerHTML = '';

            newsData.forEach(news => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.setAttribute('data-id', news.id);
                card.innerHTML = `
                    <div class="news-img" style="background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${news.image}');">
                        <span class="news-category">${news.category}</span>
                    </div>
                    <div class="news-content">
                        <div class="news-date"><i class="far fa-calendar-alt"></i> ${news.date}</div>
                        <h3>${news.title}</h3>
                        <p>${news.summary.substring(0, 100)}...</p>
                        <div class="read-more">Read Full Story <i class="fas fa-arrow-right"></i></div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(news.id));
                newsGrid.appendChild(card);
            });
        }

        // Function to open modal with news details
        function openModal(newsId) {
            const news = newsData.find(item => item.id === newsId);
            if (!news) return;

            const modal = document.getElementById('newsModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');

            modalTitle.innerHTML = `<i class="fas fa-newspaper"></i> ${news.title}`;
            modalBody.innerHTML = `
                <img src="${news.image}" alt="${news.title}" style="width:100%; border-radius:20px; margin-bottom:1rem;">
                <div class="detail-date"><i class="far fa-calendar-alt"></i> ${news.date} | <i class="fas fa-tag"></i> ${news.category}</div>
                <p><strong>${news.summary}</strong></p>
                <p>${news.fullContent}</p>
                <hr style="margin: 1rem 0; border-color: rgba(249,115,22,0.3);">
                <p style="font-size:0.85rem; color:#ffb683;"><i class="fas fa-share-alt"></i> Share this news with fellow otaku!</p>
            `;

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        // Close modal function
        function closeModal() {
            const modal = document.getElementById('newsModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        // Event listeners for modal
        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('newsModal');
            if (e.target === modal) {
                closeModal();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        renderNews();

    </script>
</body>

</html>
